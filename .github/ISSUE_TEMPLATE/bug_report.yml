name: Bug report
description: Report a reproducible defect in OPA
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include secrets, confidential mission data, or security vulnerabilities. Report security issues privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: OPA version
      placeholder: "2.43.5"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and relevant dependency versions.
      placeholder: "Windows 11, Python 3.12, PySide6 ..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start OPA with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: scientific_context
    attributes:
      label: Scientific context
      description: Include units, epoch, time scale, reference frame, integrator settings, and kernels when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal information, credentials, and sensitive data before attaching anything.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
        - label: I removed credentials and sensitive data.
          required: true
