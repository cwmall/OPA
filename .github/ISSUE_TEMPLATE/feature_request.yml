name: Feature request
description: Propose an improvement to OPA
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or research need
      description: Explain the user or scientific problem the proposal addresses.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the workflow, expected result, and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: scientific_basis
    attributes:
      label: Scientific basis
      description: For model changes, include references, equations, assumptions, units, frames, epochs, and validation data.
  - type: textarea
    id: data
    attributes:
      label: Kernel or data impact
      description: List any new SPICE kernels, datasets, licenses, file sizes, and provenance requirements.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
        - label: I can legally share every referenced file or dataset.
          required: true
